name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Both values are public by design: the publishable key ships inside the
      # browser bundle anyway, and Row Level Security protects the data.
      VITE_SUPABASE_URL: https://rabfrsssjxcjnmzhyscb.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_NIVXd2PiLT8Sh-BZrYbeBA_5Hr5aWi2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
